[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aimc"
version = "0.1.0"
description = "Intent-to-machine-code compiler: natural language -> IR -> raw x86_64 / AArch64 code"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
aimc = "aimc.cli:main"

[tool.setuptools.packages.find]
include = ["aimc*"]
